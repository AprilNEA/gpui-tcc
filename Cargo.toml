[package]
name = "gpui-tcc"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Guide users through granting macOS privacy permissions (Accessibility, Screen Recording, App Management) from a GPUI app"
readme = "README.md"
keywords = ["gpui", "macos", "tcc", "permissions", "accessibility"]
categories = ["gui", "os::macos-apis"]

[dependencies]
anyhow = "1"
gpui-kit = { version = "0.9", default-features = false }
raw-window-handle = "0.6"
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSBundle",
    "NSData",
    "NSDictionary",
    "NSEnumerator",
    "NSGeometry",
    "NSObject",
    "NSString",
    "objc2-core-foundation",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSBitmapImageRep",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "NSPanel",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
    "NSWorkspace",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-quartz-core",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "CFArray",
    "CFBase",
    "CFCGTypes",
    "CFDictionary",
    "CFNumber",
    "CFString",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "CGGeometry",
    "CGWindow",
    "objc2",
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
    "CALayer",
] }

[dev-dependencies]
gpui-kit = "0.9"

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
